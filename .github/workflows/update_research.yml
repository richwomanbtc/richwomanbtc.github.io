name: Update researchmap data

on:
  schedule:
    # Sundays at 09:17 JST. Avoid the heavily loaded top of the UTC hour.
    - cron: "17 0 * * 0"
  workflow_dispatch:

concurrency:
  group: researchmap-site-deployment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Generate researchmap content
        id: researchmap_sync
        continue-on-error: true
        run: python -m researchmap_site

      - name: Validate the generated site
        run: make check

      - name: Commit generated content to main
        if: steps.researchmap_sync.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- _auto_contents
          if git diff --cached --quiet; then
            echo "researchmap content is already current"
          else
            git commit -m "Update researchmap content"
            git push origin HEAD:main
          fi

      - name: Record a heartbeat when researchmap is unavailable
        if: steps.researchmap_sync.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit --allow-empty -m "Record failed researchmap sync"
          git push origin HEAD:main

      - name: Deploy the tracked snapshot to the page branch
        run: |
          set -euo pipefail
          cp scripts/deploy_page.sh "${RUNNER_TEMP}/deploy_page.sh"
          bash "${RUNNER_TEMP}/deploy_page.sh"

      - name: Report an upstream synchronization failure
        if: steps.researchmap_sync.outcome == 'failure'
        run: |
          echo "::error::researchmap could not be reached. Existing generated content was preserved and deployed."
          exit 1
