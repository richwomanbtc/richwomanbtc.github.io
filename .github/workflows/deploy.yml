name: Deploy site

on:
  push:
    branches: [main]

concurrency:
  group: researchmap-site-deployment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Validate the tracked site
        run: make check

      - name: Deploy the tracked snapshot to the page branch
        run: |
          set -euo pipefail
          cp scripts/deploy_page.sh "${RUNNER_TEMP}/deploy_page.sh"
          bash "${RUNNER_TEMP}/deploy_page.sh"
